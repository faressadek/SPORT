<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Operator workspaces · SPORT</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f4;color:#163f30;font:16px/1.5 system-ui}main{max-width:750px;margin:8vh auto;padding:24px}h1{font-size:clamp(32px,6vw,52px);line-height:1.1;letter-spacing:-.04em}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}a{color:inherit}nav a{background:white;border:1px solid #bdccbf;border-radius:16px;padding:22px;text-decoration:none}nav a:hover,nav a:focus-visible{background:#e8f3d8}strong,small{display:block}strong{font-size:21px}small{margin-top:5px}</style><main><a id="back" href="../athlete-preview/index.html">← Athlete home</a><h1>Which workspace do you need?</h1><nav aria-label="Operator workspaces"></nav></main><script>
const query=new URLSearchParams(location.search), ar=query.get('lang')==='ar';
document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
if(ar){document.querySelector('h1').textContent='ما نوع حساب المشغّل؟';document.querySelector('#back').textContent='العودة إلى صفحة الرياضي';}
const back=new URL('../athlete-preview/index.html',location.href);if(query.has('api'))back.searchParams.set('api',query.get('api'));document.querySelector('#back').href=back;
const options=[['coach','Coach','Session roster and training hours','مدرّب','الحصص ومواعيد التدريب'],['venue','Court owner','Court bookings, opening hours and closures','صاحب ملاعب','الحجوزات وساعات العمل والإغلاقات'],['academy','Academy owner','Programs and family enquiries','صاحب أكاديمية','البرامج واستفسارات أولياء الأمور'],['gym','Gym owner','Listings and membership enquiries','صاحب صالة رياضية','بيانات الصالة واستفسارات العضوية']];
for(const [role,en,detail,arabic,description] of options){const url=new URL('index.html',location.href);url.search=query.toString();url.searchParams.set('workspace',role);const link=document.createElement('a');link.href=url;const title=document.createElement('strong'),info=document.createElement('small');title.textContent=ar?arabic:en;info.textContent=ar?description:detail;link.append(title,info);document.querySelector('nav').append(link);}
</script></html>
