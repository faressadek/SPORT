<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provider & Admin Portal | SPORT</title>
<style>
:root{--ink:#17201b;--muted:#56615a;--brand:#174a37;--paper:#f4f6f1;--white:#ffffff;--line:#dde3d8;font:15px/1.5 'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}
.shell{width:min(1040px,calc(100% - 32px));margin:auto;padding-block:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;flex-wrap:wrap}
.brand{font-size:1.5rem;font-weight:900;font-style:italic}
.controls{display:flex;gap:8px;align-items:center}
select,button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--white);font:inherit;font-weight:650}
button.primary{background:var(--brand);color:white;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 10px;font-size:1.15rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;background:#e8f3d8;color:var(--brand)}
#workspace-header{margin-block:24px}#workspace-nav{display:flex;flex-wrap:wrap;gap:8px}#workspace-nav a{color:var(--brand);padding:8px 14px;border:1px solid var(--line);border-radius:9px;text-decoration:none}#workspace-nav a[aria-current=page]{background:var(--brand);color:white}.card{min-width:0;overflow-x:auto}[hidden]{display:none!important}</style>
</head>
<body>
<div class="shell">
  <header>
    <div><span class="brand">SPORT.</span> <span class="badge" id="role-badge">Provider / Admin</span></div>
    <div class="controls">
      <label>Role token:
        <select id="token-select">
          <option value="admin-sport">Platform Admin (admin-sport)</option>
          <option value="coach-fares">Coach / Academy (coach-fares)</option>
          <option value="venue-coastal">Venue Operator (venue-coastal)</option>
          <option value="gym-apex">Gym Operator (gym-apex)</option>
          <option value="academy-alex-youth">Academy Operator (academy-alex-youth)</option>
        </select>
      </label>
      <button type="button" class="primary" id="refresh-btn">Refresh Data</button>
    </div>
  </header>

  <section id="workspace-header" hidden><a id="change-workspace">Choose another workspace</a><h1 id="workspace-title"></h1><nav aria-label="Workspace pages" id="workspace-nav"></nav><p id="workspace-status" role="status"></p></section>
  <div class="grid">
    <section class="card">
      <h2>Active Bookings & Holds</h2>
      <div id="bookings-box">Loading...</div>
    </section>
    <section class="card">
      <h2>Opening Hours & Closures</h2>
      <div id="schedule-box">Loading...</div>
    </section>
    <section class="card">
      <h2>Gym & Academy Listings</h2>
      <div id="listings-box">Loading...</div>
    </section>
    <section class="card">
      <h2>Gym & Academy Enquiries</h2>
      <div id="enquiries-box">Loading...</div>
    </section>
    <section class="card" id="admin-card">
      <h2>Listing Moderation & Payment Outbox (Admin)</h2>
      <div id="admin-box">Loading...</div>
    </section>
  </div>
</div>
<script>
const API_BASE = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:3000';
const $ = id => document.getElementById(id);
// Enquiries are submitted by the public: escape everything before it goes into the page.
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadPortal() {
  $('workspace-status').textContent = '';
  const token = $('token-select').value;
  const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  try {
    const [ovRes, catRes] = await Promise.all([
      fetch(`${API_BASE}/api/provider/overview`, { headers }),
      fetch(`${API_BASE}/api/catalog`)
    ]);
    const ov = await ovRes.json();
    const cat = await catRes.json();
    if (!ovRes.ok) throw new Error(ov.error);
    $('role-badge').textContent = ov.role.toUpperCase();

    $('bookings-box').innerHTML = ov.bookings.length
      ? `<table><tr><th>ID</th><th>Day</th><th>Hour</th><th>Status</th></tr>${ov.bookings.map(b => `<tr><td>${esc(b.id)}</td><td>${esc(String(b.day).slice(0,10))}</td><td>${esc(b.hour)}:00</td><td><span class="badge">${esc(b.status)}</span></td></tr>`).join('')}</table>`
      : '<p>No bookings visible for this role.</p>';

    loadSchedule(headers);
    const isAdmin = ov.role === 'admin';
    const listings = ov.listings || [];
    $('listings-box').innerHTML = listings.length
      ? `<table><tr><th>Listing</th><th>Type</th><th>Area</th><th>Status</th>${isAdmin ? '<th></th>' : ''}</tr>${listings.map(l => `<tr><td>${esc(l.name)}</td><td>${esc(l.kind)}</td><td>${esc(l.area)}</td><td><span class="badge">${l.published ? 'Published' : 'Hidden'}</span></td>${isAdmin ? `<td><button type="button" data-listing="${esc(l.id)}" data-publish="${!l.published}">${l.published ? 'Unpublish' : 'Publish'}</button></td>` : ''}</tr>`).join('')}</table>`
      : '<p>No gym or academy listings for this role.</p>';
    for (const btn of $('listings-box').querySelectorAll('button[data-listing]')) btn.onclick = async () => {
      await fetch(`${API_BASE}/api/admin/listings/${encodeURIComponent(btn.dataset.listing)}`, { method: 'PATCH', headers, body: JSON.stringify({ published: btn.dataset.publish === 'true' }) });
      loadPortal();
    };

    $('enquiries-box').innerHTML = ov.enquiries.length
      ? `<table><tr><th>Ref</th><th>Target</th><th>Athlete</th><th>Phone</th></tr>${ov.enquiries.map(e => `<tr><td>${esc(e.id)}</td><td>${esc(e.targetName)}</td><td>${esc(e.name)}</td><td>${esc(e.phone)}</td></tr>`).join('')}</table>`
      : '<p>No direct enquiries yet.</p>';

    $('admin-card').hidden = ov.role !== 'admin';
    if (ov.role === 'admin') {
      $('admin-box').innerHTML = `
        <p><strong>Outbox / Refund Exceptions:</strong> ${esc(ov.outbox.length)}</p>
        <table><tr><th>Resource</th><th>Sport</th><th>Price</th></tr>${(cat.resources || []).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.sport)}</td><td>${esc(r.price)} EGP</td></tr>`).join('')}</table>
      `;
    }
  } catch (err) {
    if (!$('workspace-header').hidden) $('workspace-status').textContent = 'The booking service is unavailable. Reconnect and select Refresh Data.';
    $('bookings-box').textContent = 'Start the API server (node apps/api/src/server.mjs) to inspect live records.';
  }
}
// Hours as text: "8-12, 16-21" means 8:00 to 12:00 and 16:00 to 21:00 (start hours 8..11 and 16..20).
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const toText = hours => { const out = []; let a = null, b = null; for (const h of [...hours].sort((x, y) => x - y)) { if (a !== null && h === b + 1) b = h; else { if (a !== null) out.push(`${a}-${b + 1}`); a = b = h; } } if (a !== null) out.push(`${a}-${b + 1}`); return out.join(', '); };
const toHours = text => text.split(',').map(x => x.trim()).filter(Boolean).flatMap(r => { const [a, b] = r.split('-').map(Number); return Array.from({ length: Math.max(0, (b ?? a + 1) - a) }, (_, i) => a + i); });
async function loadSchedule(headers) {
  const box = $('schedule-box');
  const res = await fetch(`${API_BASE}/api/provider/schedule`, { headers }); const data = await res.json();
  if (!res.ok || !data.targets.length) { box.innerHTML = '<p>No coaches or clubs to manage for this role.</p>'; return; }
  const opts = data.targets.map(t => `<option value="${esc(t.target)}">${esc(t.name)}</option>`).join('');
  box.innerHTML = data.targets.map(t => `<form class="weekly" data-target="${esc(t.target)}"><h3>${esc(t.name)}</h3>
      <table><tr>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr><tr>${DAYS.map((_, i) => `<td><input name="d${i}" size="9" aria-label="${esc(t.name)} ${DAYS[i]} hours" value="${esc(toText(t.weekly ? (t.weekly[i] || []) : t.defaultHours))}"></td>`).join('')}</tr></table>
      <button type="submit">Save hours</button> <button type="button" class="reset">Use default hours</button> <small>${t.weekly ? 'Custom hours' : 'Default hours'} · e.g. 8-12, 16-21 · empty = closed</small></form>`).join('')
    + `<h3>Closures</h3><form id="closure-form"><select name="target">${opts}</select> <input type="date" name="day" required>
      <input name="hours" size="8" placeholder="all day" aria-label="Closed hours, e.g. 9-12"> <input name="reason" maxlength="120" placeholder="Reason"> <button type="submit">Add closure</button></form>
      <p id="closure-msg" role="status"></p>
      ${data.closures.length ? `<table><tr><th>Date</th><th>Where</th><th>Hours</th><th>Reason</th><th></th></tr>${data.closures.map(c => `<tr><td>${esc(c.day)}</td><td>${esc(data.targets.find(t => t.target === c.target)?.name)}</td><td>${c.hours ? esc(toText(c.hours)) : 'All day'}</td><td>${esc(c.reason)}</td><td><button type="button" data-closure="${esc(c.id)}">Remove</button></td></tr>`).join('')}</table>` : '<p>No closures.</p>'}`;
  const put = (target, weekly) => fetch(`${API_BASE}/api/provider/schedule/${encodeURIComponent(target)}`, { method: 'PUT', headers, body: JSON.stringify({ weekly }) });
  for (const f of box.querySelectorAll('form.weekly')) {
    f.onsubmit = async e => { e.preventDefault(); await put(f.dataset.target, Object.fromEntries(DAYS.map((_, i) => [i, toHours(f[`d${i}`].value)]))); loadSchedule(headers); };
    f.querySelector('.reset').onclick = async () => { await put(f.dataset.target, null); loadSchedule(headers); };
  }
  $('closure-form').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const r = await fetch(`${API_BASE}/api/provider/closures`, { method: 'POST', headers, body: JSON.stringify({ target: f.target.value, day: f.day.value, hours: f.hours.value.trim() ? toHours(f.hours.value) : null, reason: f.reason.value }) });
    const out = await r.json();
    if (!r.ok) { $('closure-msg').textContent = out.error; return; }
    await loadSchedule(headers);
    $('closure-msg').textContent = out.affectedBookings.length ? `Closure added. ${out.affectedBookings.length} existing booking(s) fall inside it and were kept: ${out.affectedBookings.map(b => b.id).join(', ')}. Contact those athletes.` : 'Closure added.';
  };
  for (const b of box.querySelectorAll('button[data-closure]')) b.onclick = async () => { await fetch(`${API_BASE}/api/provider/closures/${encodeURIComponent(b.dataset.closure)}`, { method: 'DELETE', headers }); loadSchedule(headers); };
}
$('refresh-btn').onclick = loadPortal;
$('token-select').onchange = loadPortal;
const workspaces = {
  "coach": [
    "Coach",
    "coach-fares",
    {
      "bookings": "Session roster",
      "schedule": "Training availability"
    }
  ],
  "venue": [
    "Court owner",
    "venue-coastal",
    {
      "bookings": "Court bookings",
      "schedule": "Opening hours & closures"
    }
  ],
  "academy": [
    "Academy owner",
    "academy-alex-youth",
    {
      "enquiries": "Family enquiries",
      "listings": "Academy programs"
    }
  ],
  "gym": [
    "Gym owner",
    "gym-apex",
    {
      "enquiries": "Membership enquiries",
      "listings": "Gym listings"
    }
  ]
};
const params = new URLSearchParams(location.search);
const chosen = params.get('workspace');
if (chosen && !Object.hasOwn(workspaces, chosen)) {
  const chooser = new URL('operators.html', location.href);
  params.delete('workspace');
  chooser.search = params.toString();
  location.replace(chooser);
} else {
  if (chosen) {
    const [title, token, pages] = workspaces[chosen];
    $('token-select').value = token;
    $('token-select').closest('label').hidden = true;
    $('workspace-header').hidden = false;
    $('workspace-title').textContent = title + ' dashboard';
    $('role-badge').textContent = 'Operator demo';
    const chooser = new URL('operators.html', location.href);
    params.delete('workspace');
    chooser.search = params.toString();
    $('change-workspace').href = chooser;
    function showPage() {
      const requested = location.hash.slice(1);
      const page = Object.hasOwn(pages, requested) ? requested : Object.keys(pages)[0];
      document.title = pages[page] + ' · ' + title + ' · SPORT';
      document.querySelectorAll('.grid > section').forEach(section => section.hidden = true);
      const card = $(page + '-box').closest('section');
      card.hidden = false;
      card.querySelector('h2').textContent = pages[page];
      $('workspace-nav').replaceChildren();
      for (const [key, label] of Object.entries(pages)) {
        const link = document.createElement('a');
        link.href = '#' + key;
        link.textContent = label;
        if (key === page) link.setAttribute('aria-current', 'page');
        $('workspace-nav').append(link);
      }
    }
    window.addEventListener('hashchange', showPage);
    showPage();
  }
  loadPortal();
}
</script>
</body>
</html>
