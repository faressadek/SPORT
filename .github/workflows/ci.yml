name: SPORT checks
on: [push, pull_request]
jobs:
  api-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y postgresql-client
      # Every API test runs against the in-memory store and against PostgreSQL.
      - run: npm run test:legacy
  ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pytest && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ui/test_preview.py -q
      - run: python tests/ui/smoke.py apps/athlete-preview/index.html shots
      - name: Athlete app and portal against the API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sport
        run: |
          node apps/api/src/server.mjs &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          python tests/ui/live_e2e.py . http://127.0.0.1:3000
  workspace:
    # SPORT build kit: pnpm + Turborepo apps and packages (SPEC.md §7.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec turbo run test
      - name: Build SPORT with the UI kit page
        run: pnpm --filter @sport/web build
        env:
          ENABLE_DEV_UI: 'true'
      - name: UI kit and shells in a browser (axe, 390px and 1280px, light, dark, RTL)
        run: |
          pnpm --filter @sport/ui exec playwright install --with-deps chromium
          ENABLE_DEV_UI=true pnpm --filter @sport/web start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/dev/ui > /dev/null && break; sleep 1; done
          node packages/ui/scripts/check-pages.mjs http://127.0.0.1:3000 ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots
          retention-days: 14
