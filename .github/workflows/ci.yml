name: SPORT checks
on: [push, pull_request]
jobs:
  api-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y postgresql-client
      - run: node --test "tests/api/*.test.mjs" "tests/db/*.test.mjs"
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pytest && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ui/test_preview.py -q
      - run: python tests/ui/smoke.py apps/athlete-preview/index.html shots
      - name: Live API end-to-end
        run: |
          node apps/api/src/server.mjs &
          sleep 1
          python tests/ui/live_e2e.py . http://127.0.0.1:3000
